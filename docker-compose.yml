services:
  db:
    image: pgvector/pgvector:pg16
    container_name: helpdesk_db
    restart: always
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_owner
      POSTGRES_PASSWORD: owner_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: